                            _id:
                              type: string
                              description: 32-char uppercase hex id
                            name:
                              type: string
                            icon:
                              type: string
                              description: |-
                                Renders from `https://static.moneylover.me/img/icon/<icon>.png`. The built-in
                                set is `icon_1` … `icon_143` (contiguous, verified) plus ~20 `ic_category_*`
                                aliases for the seeded defaults. `icon/data` returns
                                `error 1 get_pack_icon_error` for every payload tried, so the catalogue is
                                only discoverable by probing that CDN path.
                            type:
                              type: integer
                              description: 1 = income, 2 = expense.
                            metadata:
                              type: string
                              description: |-
                                An `IS_*` value (`IS_LOAN`, `IS_OUTGOING_TRANSFER`, `IS_REPAYMENT`,
                                `IS_UNCATEGORIZED_EXPENSE`, …) marks a **system** category the app
                                special-cases. Do not rename or delete those. Seeded defaults instead carry a
                                slug+counter (`foodndrink0`); user-created rows carry `""`.
                            exclude_accounts:
                              type: array
                              items: {}
                              description: |-
                                Wallets the category is hidden from. `[]` means global — visible in every
                                wallet, which is how the 44 shared defaults are stored. A category created via
                                `category/add` always lands wallet-local, with all other wallet ids listed
                                here; no `category/edit` payload tried could reset it to `[]`.
                            parent:
                              type: string
                              description: |-
                                Parent category `_id`, giving Money Lover a two-level tree (e.g. `Bills &
                                Utilities` → `Electricity Bill`). **Read-only over this API**: `category/add`
                                silently drops `parent`, and `category/edit` rejects it with
                                `error 1 sync_error_data_invalid` under every key tried (`parent`, `parent_id`,
                                `parentId`, alone or with the full row). Existing parent links were seeded
                                server-side or set by the mobile app, so a taxonomy built here is necessarily
                                flat.
                            account:
                              type: string
                              description: 32-char uppercase hex id
                            group:
                              type: integer
                            id:
                              type: string
                              description: 32-char uppercase hex id
        400:
          "$ref": "#/components/responses/BadBody"
        401:
          "$ref": "#/components/responses/Unauthorized"
      description: Observed 584 records on the reference account.
