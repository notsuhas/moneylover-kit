  -
    name: transaction
    description: Transactions — the bulk of the data
  -
    name: category
    description: Category tree, per wallet or across all
  -
    name: event
    description: Events, used for trips and campaigns
  -
    name: budget
    description: Budgets and their matched transactions
  -
    name: debt
    description: Debt and loan records grouped by person
  -
    name: linked
    description: Bank-linking providers
  -
    name: icon
    description: Icon packs
  -
    name: report
    description: Reporting route; parameters unresolved
