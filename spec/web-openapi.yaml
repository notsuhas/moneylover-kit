  "/user/refresh-token":
    post:
      operationId: user_refresh_token
      summary: Exchange a refresh token for a new access token
      description: |-
          The only part of auth that can be automated. Takes no Authorization header and no client secret. Returns a new access token (7 days) and a rotated refresh token (~10 years); the rotated one works for the next call, so the chain is indefinite.
          
          Verified: the pre-logout access token still worked after signing out, so tokens are not revoked server-side.
      tags:
        - user
      security: []
      requestBody:
        required: true
