# Generated from live captures; see docs/moneylover-api.md
openapi: 3.1.0
info:
  title: Money Lover Web API (unofficial)
  version: 0.1.0
  summary: Reverse engineered from the web.moneylover.me client, Sep 2026.
  description: |-
      Unofficial specification for the private API behind the Money Lover web app. Reverse engineered by capturing the client's own traffic and probing an 840-path candidate matrix against a real account.
      
      **Shape.** Every operation is `POST`, takes a JSON body (`{}` when it has no parameters), and answers `200` with a uniform envelope. HTTP status is not a reliable success signal — read `error` instead.
      
      **Quirks that will bite you.**
      - `revoapi.moneylover.me` appears in the client config but rejects these calls with `error 706 Oauth expire`. The working host is `web.moneylover.me/api`, which proxies it.
      - A request with **no** `Authorization` header returns `error: 0` and an **empty** `data` array rather than 401. Absence of data does not mean absence of data.
      - Cloudflare blocks non-browser User-Agents; send a browser UA or requests fail before reaching the API.
      - A malformed body returns an Express `body-parser` stack trace instead of the envelope.
      - `error: 1` generally means the route exists but the payload was rejected — useful for discovery.
      
      **Four different response shapes.** A client must handle all of them:
      1. Normal: `{error, msg, action, data}`.
      2. Invalid token: `{s: false, e: 706, msg: "Not authorized error", router}` — note the **abbreviated keys**; code keying on `error` will not see this and may read `data` as undefined.
      3. Missing `Authorization` header entirely: a normal envelope with `error: 0` and empty `data`. Silent.
      4. Malformed JSON body: a raw Express `body-parser` stack trace.
      
      Not affiliated with or endorsed by Money Lover. This documents a private API for use against your own account; it can change without notice.
      
      **This surface is discovered, not complete.** A second probe pass found three more routes (`budget|debt|event/list/full`) that the first missed, and no endpoint for recurring transactions could be found at all despite that being a shipped feature — so more routes almost certainly exist under names not guessed here.
      
      **Known outage at time of writing.** Every route that mutates the transaction store (`transaction/add|edit|delete`, `category/add`) hangs and is cut off by Cloudflare with **HTTP 524** after ~125s — the origin never responds. Reads stay sub-second and the other write routes answer normally, so this is a fault at Money Lover's end, not a client or rate-limit issue. The transaction payloads below were captured while the endpoints were healthy.
      
      **Field naming is inconsistent across the API and this is the main source of wasted time.** Reads take `walletId`. `transaction/add|edit` take `account`. `category/add` takes `walletId`. And `transaction`'s `category` must be the id from `category/list-all`, never the one from `category/list`.
      
      **Coverage.** 15 read endpoints were each called successfully and their schemas inferred from real responses. The transaction write trio (`add`, `edit`, `delete`) was captured from the client and exercised end to end against a live account, then reverted — the ledger returned to a byte-identical transaction id list. Remaining write endpoints (wallet, category, event, budget) are confirmed to exist but their payloads were not captured.
