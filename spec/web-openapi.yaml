  "/category/add":
    post:
      operationId: category_add
      summary: Create a category in one wallet
      description: |-
          **Takes `walletId`, not `account`** — the opposite of `transaction/add`. That asymmetry is the whole difficulty of this endpoint.
          
          `type` is 1 for income and 2 for expense. Returns only the new `_id`. Categories are per-wallet, so building a taxonomy across the account means one call per wallet per category.
          
          The returned `_id` is a provisional `web…`-prefixed id. A category at this stage is invisible to `category/list-all` and **cannot be assigned to a transaction** — `transaction/add` with it hangs for 120s rather than erroring. One `category/edit` on that id **promotes** it: the row gains a real hex `_id`, appears in `category/list-all` with `exclude_accounts` listing every other wallet, and transaction assignment then works in ~0.6s.
          
          Keep the `web…` id after creating. It stays the sync key: `category/delete` only accepts that form, never the promoted `_id` (see `/category/delete`).
          
          `parent` is silently ignored here — see the `parent` field on the Category schema.
      tags:
        - category
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              type: object
              properties:
                name:
                  type: string
                walletId:
                  type: string
                  description: Wallet _id. NOT `account`.
                icon:
                  type: string
                  examples:
                    - ic_category_foodndrink
                type:
                  type: integer
                  enum:
                    - 1
                    - 2
                  description: 1 = income, 2 = expense.
              required:
                - name
                - walletId
                - icon
                - type
      responses:
        200:
          description: error 0, msg `category_create_success`
          content:
            "application/json":
              schema:
                allOf:
                  -
                    "$ref": "#/components/schemas/Envelope"
                  -
                    type: object
                    properties:
                      data:
                        type: object
                        properties:
                          _id:
                            type: string
        400:
          "$ref": "#/components/responses/BadBody"
        401:
          "$ref": "#/components/responses/Unauthorized"
  "/category/delete":
    post:
      operationId: category_delete
      summary: Delete a category
      description: |-
          `_id` must be the provisional `web…` id returned by `category/add`, **not** the promoted hex `_id` that `category/list-all` reports. Passing the promoted id returns `error 1 sync_error_data_invalid`, as does every other shape tried (`id`, `categoryId`, `_id`+`account`, `_id`+`walletId`, the full row).
          
          A successful delete returns `error 0` immediately but `category/list-all` still shows the row for a few seconds; it cleared within 10s on the reference account. No wallet id, no reassignment target.
      tags:
        - category
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              type: object
              properties:
                _id:
                  type: string
              required:
                - _id
      responses:
        200:
          description: error 0, msg `category_delete_success`
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Envelope"
        400:
          "$ref": "#/components/responses/BadBody"
        401:
          "$ref": "#/components/responses/Unauthorized"
  "/category/edit":
    post:
      operationId: category_edit
      summary: Rename or re-icon a category
      description: |-
          Minimum accepted payload is `_id` + `name` + `icon`; `_id` alone or `_id`+`name` returns `error 1`. Categories are **per-wallet**, so renaming a concept across the account means one call per wallet that has it.
          
          Discovered by sending the category's own current values back — a deliberate no-op. Note that even an identical-value edit increments the category's `metadata` counter, so it is not perfectly inert.
      tags:
        - category
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              type: object
              properties:
                _id:
                  type: string
                name:
