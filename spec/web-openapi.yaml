components:
  securitySchemes:
    AuthJWT:
      type: apiKey
      in: header
      name: Authorization
      description: |-
          Value is `AuthJWT <access_token>` — note the custom scheme name, not `Bearer`.
          
          The token is an HS256 JWT with claims `type: access-token`, `userId`, `tokenDevice`, `clientId`, `client` and a ~7 day `exp`. The web client's OAuth client id is `kHiZbFQOw5LV` (from its runtime config).
          
          ### Getting a token
          
          **Interactive login is reCAPTCHA-gated and cannot be scripted.** The flow:
          1. `web.moneylover.me` redirects to `oauth.moneylover.me/auth?client=kHiZbFQOw5LV&token=<request-token>&callback=<url>`. The `token` query param is a short-lived JWT with `type: request-token`, a `code` UUID and a 1 hour expiry.
          2. The page posts credentials to `POST https://oauth.moneylover.me/web/token` with headers `Authorization: Bearer <request-token>`, `client: kHiZbFQOw5LV` and `apiversion: 4`, and body `{client_info: true, email, password, "g-recaptcha-response": "..."}`.
          3. On success the browser is redirected to `<callback>?access_token=…&refresh_token=…&expire=…&status=true`.
          
          That `g-recaptcha-response` is invisible reCAPTCHA v3, so step 2 cannot be replayed from a script. Log in once in a browser and keep the **refresh token**.
          
          ### Staying authenticated
          
          `POST /user/refresh-token` with `{"refreshToken": "…"}` returns a fresh access token and a rotated refresh token. It needs **no Authorization header and no client secret**. The access token lasts 7 days; the refresh token is issued with a ~10 year expiry, so one browser login is enough to keep a client running indefinitely.
          
          Do not use `oauth.moneylover.me/token` — it answers `OauthErrorClientSecretNotValidate` and the web client's secret is not in its bundle.
          
          **Signing out does not revoke anything.** An access token captured before a logout still authenticated successfully afterwards, so treat these tokens as bearer secrets valid until their `exp`.
  responses:
    Unauthorized:
      description: "Token present but rejected. Uses abbreviated keys instead of the normal envelope, so clients keying on `error` will miss it. A request with no Authorization header instead returns a normal envelope with `error: 0` and empty `data`."
      content:
        "application/json":
          schema:
            type: object
            properties:
              s:
                type: boolean
                examples:
                  - false
              e:
                type: integer
                examples:
                  - 706
              msg:
                type: string
                examples:
                  - Not authorized error
              router:
                type: string
                examples:
                  - /api/wallet/list
    BadBody:
      description: Malformed JSON body. The API answers with an Express `body-parser` error object — note this is NOT the standard envelope, so a client that assumes `error`/`data` will throw here.
      content:
        "application/json":
          schema:
            type: object
            properties:
              message:
                type: string
              stack:
                type: string
              statusCode:
                type: integer
                examples:
                  - 400
              type:
                type: string
                examples:
                  - entity.parse.failed
  schemas:
    Envelope:
      type: object
      description: "Uniform response wrapper. `error: 0` is success; `1` means the payload was rejected."
      properties:
        error:
          type: integer
          examples:
            - 0
            - 1
            - 706
        msg:
          type: string
          description: Machine-readable status slug, e.g. `wallet_list`.
        action:
          type:
            - string
            - "null"
        data:
          description: Payload; shape depends on the operation.
      required:
        - error
