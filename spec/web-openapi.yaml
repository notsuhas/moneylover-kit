          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Envelope"
        400:
          "$ref": "#/components/responses/BadBody"
        401:
          "$ref": "#/components/responses/Unauthorized"
  "/transaction/add":
    post:
      operationId: transaction_add
      summary: Create a transaction
      description: |-
          Captured from the web client and exercised end to end from a plain HTTP client.
          
          **Two traps.** The field names are `account` and `category`, not `walletId`/`categoryId` as every read endpoint uses. And `category` must be the id from **`category/list-all`** — that endpoint returns the *same* id for a given category name across every wallet, and it is the one writes accept. `category/list?walletId=…` returns a different, wallet-scoped id for the same category; sending that makes the request hang until Cloudflare returns 524 at ~120s instead of returning an error. The response echoes back the wallet-scoped id, which is what makes this so confusing to debug.
          
          The response echoes the stored record, whose `_id` is prefixed `web` for anything created through this client. Note the server may return a **different** `category` id than the one sent, resolving it to the equivalent category in the target wallet.
      tags:
        - transaction
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              type: object
              properties:
                account:
                  type: string
                  description: Wallet _id from wallet/list. NOT `walletId`.
                category:
                  type: string
                  description: Category _id **from `category/list-all`**, not from `category/list`. The two return different ids for the same category and passing the wallet-scoped one hangs the request for 120s. See the warning on this operation.
                amount:
                  type: number
                  description: Always positive; income vs expense comes from the category's `type`.
                note:
                  type: string
                displayDate:
                  type: string
                  format: date
                  examples:
                    - 2026-09-10
                event:
                  type: string
                  description: Event _id, or empty string.
                exclude_report:
                  type: boolean
                with:
                  type: array
                  items:
                    type: string
                  description: People names.
                longtitude:
                  type: number
                  description: Spelled this way by the API.
                latitude:
                  type: number
                addressName:
                  type: string
                addressDetails:
                  type: string
                addressIcon:
                  type: string
                image:
                  type: string
              required:
                - account
                - category
                - amount
                - displayDate
      responses:
        200:
          description: error 0, msg `transaction_add_success`
          content:
            "application/json":
              schema:
                allOf:
                  -
                    "$ref": "#/components/schemas/Envelope"
                  -
                    type: object
                    properties:
                      data:
                        type: object
                        properties:
                          account:
                            type: string
                            description: Wallet _id from wallet/list. NOT `walletId`.
                          category:
                            type: string
                            description: Category _id **from `category/list-all`**, not from `category/list`. The two return different ids for the same category and passing the wallet-scoped one hangs the request for 120s. See the warning on this operation.
                          amount:
                            type: number
                            description: Always positive; income vs expense comes from the category's `type`.
                          note:
                            type: string
                          displayDate:
                            type: string
                            format: date
                            examples:
                              - 2026-09-10
                          event:
                            type: string
                            description: Event _id, or empty string.
                          exclude_report:
                            type: boolean
                          with:
                            type: array
                            items:
                              type: string
                            description: People names.
                          longtitude:
                            type: number
                            description: Spelled this way by the API.
                          latitude:
                            type: number
                          addressName:
                            type: string
                          addressDetails:
                            type: string
                          addressIcon:
                            type: string
                          image:
                            type: string
                          _id:
                            type: string
                          tokenDevice:
                            type: string
                            examples:
                              - web
        400:
          "$ref": "#/components/responses/BadBody"
        401:
          "$ref": "#/components/responses/Unauthorized"
  "/transaction/edit":
